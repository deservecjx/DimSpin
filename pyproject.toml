[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DimSpin"
dynamic = ["version"]
description = "EPR/ESR spectrum simulator for spin Hamiltonians and spin-electric coupling (SEC) tensors, featuring EFM, MFM and 2D angle-dependent single-crystal analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jia-Xin Chen" }]
keywords = [
    "EPR",
    "ESR",
    "electron paramagnetic resonance",
    "spin Hamiltonian",
    "spin-electric coupling",
    "electric-field modulation",
    "spectroscopy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/deservecjx/DimSpin"
Repository = "https://github.com/deservecjx/DimSpin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dimspin*"]

[tool.setuptools.dynamic]
version = { attr = "dimspin.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["dimspin"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"] # I is the conventional symbol for nuclear spin.
